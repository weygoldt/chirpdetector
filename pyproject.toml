[project]
name = "chirpdetector"
version = "2.0.0"
description = "Detect chirps of wave-type weakly electric fish in grid recordings and assign them to their emitters."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Patrick Weygoldt", email = "patrick@weygoldt.com" }]
keywords = ["electric fish", "chirps", "object detection", "neuroethology"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    # A direct reference, pinned to a gridtools release tag: "gridtools" on
    # PyPI is an unrelated package. The root project of
    # chirp_competition_upgrade overrides it with the editable submodule for
    # development.
    "gridtools @ git+https://github.com/weygoldt/gridtools@v2.0.0",
    "numpy>=2.5",
    "opencv-python>=4.12",
    "pandas>=3.1.1",
    "pyarrow>=26",
    "scipy>=1.18.1",
    "torch>=2.15",
    # The dual-head detector (the default model) subclasses RT-DETRv2's loss
    # internals, which change between transformers minor releases;
    # tests/models pin the behaviour.
    "transformers>=5.22.2,<5.23",
    "typer>=0.29.1",
    "ultralytics>=8.4.211,<8.5",
]

[project.scripts]
chirpdetector = "chirpdetector.cli:app"

[project.urls]
Repository = "https://github.com/weygoldt/chirpdetector"

[project.optional-dependencies]
label = [
    "matplotlib>=3.11.2",
]
# Kept so that existing `chirpdetector[dualhead]` installs keep working;
# transformers is a core dependency now.
dualhead = [
    "transformers>=5.22.2,<5.23",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170",
    "pre-commit>=4.7",
    "pyright>=1.1.414",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = [
    "slow: long-running tests",
    "gpu: tests that need a CUDA device (skipped if absent)",
    "data: tests that need the recordings on /mnt/data2 (skipped if absent)",
    "network: tests that download the published models (CHIRPDETECTOR_TEST_NETWORK=1)",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF", "PT"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
