[project]
name = "chirpdetector"
version = "2.0.0.dev0"
description = "Detect chirps of wave-type weakly electric fish in grid recordings and assign them to their emitters."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Patrick Weygoldt", email = "patrick@weygoldt.com" }]
keywords = ["electric fish", "chirps", "object detection", "neuroethology"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "gridtools",
    "numpy>=2.5",
    "pandas>=3.1.1",
    "scipy>=1.18.1",
    "torch>=2.15",
    "typer>=0.29.1",
]

[project.scripts]
chirpdetector = "chirpdetector.cli:app"

[project.urls]
Repository = "https://github.com/weygoldt/chirpdetector"

[project.optional-dependencies]
label = [
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170",
    "pre-commit>=4.7",
    "pyright>=1.1.414",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "ruff>=0.17",
]

[tool.uv.sources]
# "gridtools" on PyPI is an unrelated package; always resolve the sibling checkout.
gridtools = { path = "../gridtools", editable = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = [
    "slow: long-running tests",
    "gpu: tests that need a CUDA device (skipped if absent)",
    "data: tests that need the recordings on /mnt/data2 (skipped if absent)",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF", "PT"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
