site_name: chirpdetector
site_description: Detect chirps of wave-type weakly electric fish in grid recordings and assign them to their emitters.
repo_url: https://github.com/weygoldt/chirpdetector
repo_name: weygoldt/chirpdetector
edit_uri: edit/main/docs/

# Build: uvx --from mkdocs==1.6.1 --with mkdocs-material==9.8.1 mkdocs build --strict
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quickstart: quickstart.md
      - Pretrained models: models.md
  - Detecting chirps:
      - The production pipeline: pipeline.md
      - Python API: api.md
      - Post-processing: postprocessing.md
      - Chirp parameters: decoder.md
      - Click removal: clicks.md
  - Training:
      - Detector datasets: datasets.md
      - Training a detector: training.md
      - Training the decoder: decoder-training.md
      - Evaluation: evaluation.md
  - Labelling:
      - Labelling chirps and emitters: labelling.md
      - Human against model: benchmark.md
  - Background:
      - Design notes: design.md
      - Limitations: limitations.md
  - Reference:
      - Command line: cli.md
      - Development: development.md
